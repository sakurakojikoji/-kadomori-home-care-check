<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KADOMORI HOME CARE CHECK</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#242321;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.wrap{max-width:590px;margin:auto;padding:24px 18px}.brand{font-family:Georgia,serif;letter-spacing:.2em;margin-bottom:22px}.card{background:white;border-radius:24px;padding:26px 22px;box-shadow:0 8px 28px #00000009}h1{font-size:28px;line-height:1.4}p{line-height:1.8;color:#69645d}.small{font-size:12px;letter-spacing:.12em;color:#847d75}.options{display:grid;gap:10px;margin-top:22px}button{font:inherit;cursor:pointer;border:1px solid #ded9d1;border-radius:14px;background:white;padding:16px;text-align:left;color:#242321}button:active{background:#f1eee8}.primary{background:#242321;color:white;text-align:center;width:100%;margin-top:20px}.progress{height:4px;background:#e1dbd2;border-radius:8px;margin-bottom:24px}.bar{height:100%;background:#242321;border-radius:8px;transition:width .2s}.result{border-top:1px solid #ddd8d0;padding-top:18px;margin-top:22px}.result h2{font-size:22px;margin:7px 0}.product-photo{display:block;width:100%;max-width:290px;height:230px;object-fit:contain;margin:12px auto;border-radius:12px}.product-photo-link{display:block;text-decoration:none}.shoplink{display:block;background:#242321;color:white;text-decoration:none;border-radius:12px;padding:14px;text-align:center;font-size:14px;margin:14px 0 2px}.note{background:#f6f2eb;border-radius:14px;padding:14px;font-size:13px;line-height:1.7}</style></head><body><main class="wrap"><div class="brand">KADOMORI</div><div class="progress"><div class="bar" id="bar" style="width:0"></div></div><section class="card" id="app"></section></main><script>
const ENDPOINT=''; // Google Apps Script /exec URL after setup
const STORE='代官山';
const main=[['face','顔のむくみ・フェイスライン'],['clench','食いしばり・エラ張り'],['aging','たるみ・ハリ・年齢変化'],['skin','毛穴・乾燥・肌荒れ'],['body','脂肪・体型・身体のむくみ'],['sleep','疲れ・睡眠'],['cold','冷え・巡り'],['gut','腸・お腹・食生活'],['stress','ストレス・気分'],['hair','頭皮・髪']];
const detail={
face:['朝、顔がパンパンになる','夕方になると顔が重く感じる','フェイスラインがもたつく','乾燥・ハリ不足も気になる'],
clench:['寝ている間が気になる','ストレスが強い時','首肩もこわばる','エラの張り感'],
aging:['フェイスライン','ハリ・弾力','乾燥','身体全体の年齢変化'],
skin:['毛穴・メイク汚れ','クレンジング後の乾燥','洗顔後のつっぱり','日中の乾燥','肌荒れしやすい'],
body:['食生活','身体のむくみ','冷え','身体の重だるさ'],
sleep:['寝つき','眠りが浅い','寝ても疲れる','考え事で休まらない'],
cold:['手足の冷え','むくみ','入浴で整えたい','巡りが気になる'],
gut:['食生活の乱れ','お腹のスッキリ感','胃腸の調子','内側から美容ケア'],
stress:['睡眠にも影響','女性特有のゆらぎ','気分転換','ほっとする時間'],
hair:['頭皮の乾燥','髪のハリ・コシ','ボリューム感','年齢に合わせた頭皮ケア']
};
const common=[
['いつ一番気になりますか？',['朝起きたとき','日中','夕方〜夜','一日中','日によって違う']],
['お肌について、一番近いものは？',['毛穴・汚れ','乾燥','ハリ・弾力','肌荒れ','特にない']],
['身体について、一番近いものは？',['むくみ','冷え','お腹・胃腸','疲れ','特にない']],
['普段の生活で、一番当てはまるものは？',['食生活が乱れがち','睡眠が気になる','ストレスが多い','年齢変化が気になる','特にない']]
];
const products={
cleanser:['KADOMORI クレンジング','メイクや毛穴汚れを落とす毎日のケアに。'],
wash:['KADOMORI 洗顔','朝の洗顔習慣を大切にしたい方へ。'],
cream:['KADOMORI エイジングケアクリーム','乾燥やハリ不足が気になる方の保湿ケアに。'],
saturn:['SATURN','日中も取り入れやすいミストケア。'],
jupiter:['JUPITER','頭皮や髪のケアを意識したい方へ。'],
enzyme:['JIBUN酵素＋','食生活を見直したい方のインナーケア候補。'],
nmn:['JIBUN NMN+','年齢に合わせたインナーケアに関心がある方へ。'],
salt:['LUNA CORE SALT','日々の食生活を意識する方へ。'],
mat:['エーテルマット','休息時間のセルフケアを取り入れたい方へ。'],
bath:['エーテルバススティック','バスタイムを心地よい時間にしたい方へ。'],
deru:['DERU','すっきりした毎日を意識したい方のハーブティー。'],
meguri:['MEGURI','忙しい日々にほっとする時間を作りたい方へ。'],
punpun:['PUNPUN','気分をリフレッシュしたい時に。'],
utatane:['UTATANE','夜のリラックスタイムに。'],
yomogi:['YOMOGI','温かい飲み物でくつろぎたい時に。'],
ousama:['OUSAMA','食後などのリラックスタイムに。']
};
const productUrls={"cleanser":"https://kadomori.shop/products/kd_clj_001_001","wash":"https://kadomori.shop/products/kd_fw_001_001","cream":"https://kadomori.shop/products/kd-acc-001-001","saturn":"https://kadomori.shop/products/saturn","nmn":"https://kadomori.shop/products/kd_nmn_001_001","deru":"https://kadomori.shop/products/kd-hbt-001-003","meguri":"https://kadomori.shop/products/kd-hbt-001-004","punpun":"https://kadomori.shop/products/kd-hbt-001-002","utatane":"https://kadomori.shop/products/kd-hbt-001-001","yomogi":"https://kadomori.shop/products/kd-hbt-001-006","ousama":"https://kadomori.shop/products/kd-hbt-001-005","jupiter":"https://kadomori.shop/products/jupiter","enzyme":"https://kadomori.shop/products/kd-jnk-001-002","salt":"https://kadomori.shop/products/luna-core-salt-250g","mat":"","bath":""};
const scoreMap={"face":[["wash","saturn"],["saturn","salt"],["cream","saturn"],["cream","saturn"]],"clench":[["cream","utatane"],["cream","meguri"],["cream","bath"],["cream","mat"]],"aging":[["cream","saturn"],["cream","saturn"],["cream","saturn"],["nmn","cream"]],"skin":[["cleanser","wash"],["cleanser","wash"],["wash","saturn"],["saturn","cream"],["cleanser","enzyme"]],"body":[["enzyme","deru"],["deru","salt"],["yomogi","enzyme"],["salt","deru"]],"sleep":[["utatane","mat"],["mat","utatane"],["mat","utatane"],["utatane","bath"]],"cold":[["yomogi","enzyme"],["deru","salt"],["bath","salt"],["meguri","bath"]],"gut":[["enzyme","ousama"],["enzyme","deru"],["enzyme","ousama"],["enzyme","nmn"]],"stress":[["utatane","mat"],["meguri","punpun"],["utatane","meguri"],["utatane","yomogi"]],"hair":[["jupiter","salt"],["jupiter","nmn"],["jupiter","nmn"],["jupiter","nmn"]]};
let answers=[],step=-1;const app=document.getElementById('app'),bar=document.getElementById('bar');
function render(){bar.style.width=(step<0?0:Math.min(step+1,6)/6*100)+'%';if(step===-1){app.innerHTML='<div class="small">HOME CARE CHECK</div><h1>今日整えた状態を、おうちでも。</h1><p>施術お疲れさまでした。6つの質問から、今のあなたに合ったホームケアをご提案します。</p><p class="small">約1〜2分・すべて選択式</p><button class="primary" id="start">診断をはじめる</button>';document.getElementById('start').onclick=()=>{step=0;render()};return}
if(step===6){showResult();return}
let title,opts;if(step===0){title='今、一番気になっているお悩みは？';opts=main.map(x=>x[1])}else if(step===1){title='その中でも、一番近い状態は？';opts=detail[main[answers[0]].at(0)]}else{title=common[step-2][0];opts=common[step-2][1]}
app.innerHTML='<div class="small">QUESTION '+(step+1)+' / 6</div><h1>'+title+'</h1><div class="options" id="opts"></div><button id="back" style="border:0;padding:12px;margin-top:12px;color:#777">← 戻る</button>';
const box=document.getElementById('opts');opts.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{answers[step]=i;step++;render()};box.appendChild(b)});document.getElementById('back').onclick=()=>{step--;render()};
}
async function loadProductPhoto(key){
 const url=productUrls[key];if(!url)return;
 const el=document.querySelector('[data-product-photo="'+key+'"]');if(!el)return;
 try{
  const productUrl=new URL(url);
  if(productUrl.hostname!=='kadomori.shop'||!productUrl.pathname.startsWith('/products/'))return;
  const response=await fetch(productUrl.origin+productUrl.pathname+'.js');
  if(!response.ok)return;
  const product=await response.json();
  const image=product.featured_image||(product.images&&product.images[0]);
  if(!image)return;
  const img=document.createElement('img');img.className='product-photo';img.alt=products[key][0]+'の商品画像';img.loading='lazy';img.referrerPolicy='no-referrer';img.src=image.startsWith('//')?'https:'+image:image;
  el.appendChild(img);
 }catch(e){/* keep product name and purchase link when the shop disallows image requests */}
}
function productPhoto(key){return productUrls[key]?'<a class="product-photo-link" data-product-photo="'+key+'" href="'+productUrls[key]+'" target="_blank" rel="noopener noreferrer" aria-label="'+products[key][0]+'の商品ページへ"></a>':''}
function showResult(){
const category=main[answers[0]][0],pair=scoreMap[category][answers[1]];
const best=pair[0],plus=pair[1];
const labels=[main[answers[0]][1],detail[category][answers[1]],...common.map((q,i)=>q[1][answers[i+2]])];
app.innerHTML='<div class="small">YOUR HOME CARE CHECK</div><h1>'+labels[0]+' ケアタイプ</h1><div class="result"><div class="small">BEST ITEM</div><h2>'+products[best][0]+'</h2>'+productPhoto(best)+'<p>'+products[best][1]+'</p>' +(productUrls[best]?'<a class="shoplink" href="'+productUrls[best]+'" target="_blank" rel="noopener noreferrer">商品詳細・購入ページを見る ↗</a>':'<p class="small">ご購入についてはスタッフにお問い合わせください。</p>')+'</div><div class="result"><div class="small">PLUS CARE</div><h2>'+products[plus][0]+'</h2>'+productPhoto(plus)+'<p>'+products[plus][1]+'</p>' +(productUrls[plus]?'<a class="shoplink" href="'+productUrls[plus]+'" target="_blank" rel="noopener noreferrer">商品詳細・購入ページを見る ↗</a>':'<p class="small">ご購入についてはスタッフにお問い合わせください。</p>')+'</div><p class="note">今回のポイント：'+labels[1]+'。気になる商品はスタッフにお声がけください。<br>※診断結果は一般的なホームケアのご提案であり、医学的な診断ではありません。</p><button class="primary" id="reset">もう一度診断する</button>';
loadProductPhoto(best);if(plus!==best)loadProductPhoto(plus);
document.getElementById('reset').onclick=()=>{answers=[];step=-1;render()};
if(ENDPOINT){const payload=new URLSearchParams({diagnosisId:'KDM-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),store:STORE,q1:labels[0],q2:labels[1],q3:labels[2],q4:labels[3],q5:labels[4],q6:labels[5],q7:'',diagnosisType:labels[0]+' ケアタイプ',bestItem:products[best][0],plusCare:products[plus][0]});fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:payload}).catch(()=>{})}
}
render();
</script></body></html>
